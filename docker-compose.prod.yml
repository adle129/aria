# Production / R1 customer — one-click: deploy/scripts/start.sh

x-backend-environment: &backend-environment
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:32b}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
  MOCK_LLM: ${MOCK_LLM:-false}
  MOCK_RAG: ${MOCK_RAG:-false}
  ARIA_UI_PROFILE: ${ARIA_UI_PROFILE:-r1}
  KB_DEBUG_ENABLED: ${KB_DEBUG_ENABLED:-false}
  OLLAMA_MAX_CONCURRENT: ${OLLAMA_MAX_CONCURRENT:-1}
  TASK_WORKER_POLL_SECONDS: ${TASK_WORKER_POLL_SECONDS:-2}
  TASK_JOB_AVG_SECONDS: ${TASK_JOB_AVG_SECONDS:-120}
  KB_ASYNC_INDEX_ENABLED: ${KB_ASYNC_INDEX_ENABLED:-true}
  RAG_SIMILARITY_THRESHOLD: ${RAG_SIMILARITY_THRESHOLD:-0.65}
  PROMPT_VERSION: ${PROMPT_VERSION:-v1}
  TASK_WORKER_INLINE: ${TASK_WORKER_INLINE:-false}
  UPLOAD_PATH: ${UPLOAD_PATH:-/app/data/uploads}
  OUTPUT_PATH: ${OUTPUT_PATH:-/app/data/outputs}
  KNOWLEDGE_BASE_PATH: ${KNOWLEDGE_BASE_PATH:-/app/data/knowledge_base}
  TEMPLATE_PATH: ${TEMPLATE_PATH:-/app/data/templates}
  APP_VERSION: ${APP_VERSION:-1.0.0}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  AUTH_ENABLED: ${AUTH_ENABLED:-true}
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}

x-frontend-build-args: &frontend-build-args
  NEXT_PUBLIC_API_BASE_URL: /api/v1
  NEXT_PUBLIC_ARIA_UI_PROFILE: ${ARIA_UI_PROFILE:-r1}

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aria-postgres
    environment:
      POSTGRES_DB: aria_db
      POSTGRES_USER: aria_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ${ARIA_DATA_ROOT:-/data/aria}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aria_admin -d aria_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    container_name: aria-backend
    environment:
      <<: *backend-environment
      DATABASE_URL: postgresql://aria_admin:${POSTGRES_PASSWORD}@postgres:5432/aria_db
      SAMPLES_RFQ_PATH: /app/samples/rfq
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    volumes:
      - ${ARIA_DATA_ROOT:-/data/aria}/app:/app/data
      - ./samples:/app/samples:ro
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    container_name: aria-worker
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *backend-environment
      DATABASE_URL: postgresql://aria_admin:${POSTGRES_PASSWORD}@postgres:5432/aria_db
      SAMPLES_RFQ_PATH: /app/samples/rfq
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      SKIP_MIGRATE: "true"
    volumes:
      - ${ARIA_DATA_ROOT:-/data/aria}/app:/app/data
      - ./samples:/app/samples:ro
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        <<: *frontend-build-args
    container_name: aria-frontend
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/',(r)=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:alpine
    container_name: aria-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
