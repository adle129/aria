# Production: bind persistent data to host disk (see docs/deployment-guide.md)
services:
  postgres:
    image: postgres:16-alpine
    container_name: aria-postgres
    environment:
      POSTGRES_DB: aria_db
      POSTGRES_USER: aria_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ${ARIA_DATA_ROOT:-/data/aria}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aria_admin -d aria_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  backend:
    build: ./backend
    container_name: aria-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://aria_admin:${POSTGRES_PASSWORD}@postgres:5432/aria_db
    volumes:
      - ${ARIA_DATA_ROOT:-/data/aria}/app:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: /api/v1
    container_name: aria-frontend
    depends_on:
      - backend
    restart: unless-stopped
  nginx:
    image: nginx:alpine
    container_name: aria-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
