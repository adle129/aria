# Aliyun 4C8G remote UI demo — China mirrors + lightweight backend (no AI packages)
# NOT R1-equivalent: no pgvector, no worker. Do not use for R1 feature acceptance.
# Usage: docker compose -f docker-compose.aliyun-demo.yml up --build -d

services:
  postgres:
    image: docker.m.daocloud.io/library/postgres:16-alpine
    container_name: aria-postgres
    environment:
      POSTGRES_DB: aria_db
      POSTGRES_USER: aria_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aria_admin -d aria_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.cn
      args:
        INSTALL_AI: "false"
    container_name: aria-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://aria_admin:${POSTGRES_PASSWORD:-localdev123}@postgres:5432/aria_db
      SAMPLES_RFQ_PATH: /app/samples/rfq
    volumes:
      - ./backend/data:/app/data
      - ./samples:/app/samples:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.cn
      args:
        NEXT_PUBLIC_API_BASE_URL: /api/v1
    container_name: aria-frontend
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: docker.m.daocloud.io/library/nginx:alpine
    container_name: aria-nginx
    ports:
      # Host port (default 8888 — port 80 is often taken). Override via ARIA_DEMO_HTTP_PORT in .env
      - "${ARIA_DEMO_HTTP_PORT:-8888}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
