# Dev / Demo — one-click: scripts/up.ps1  or  scripts/up.sh
x-backend-environment: &backend-environment
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:14b}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
  MOCK_LLM: ${MOCK_LLM:-true}
  MOCK_RAG: ${MOCK_RAG:-true}
  ARIA_UI_PROFILE: ${ARIA_UI_PROFILE:-experience}
  KB_DEBUG_ENABLED: ${KB_DEBUG_ENABLED:-false}
  PROMPT_VERSION: ${PROMPT_VERSION:-v1}
  CHROMA_PATH: ${CHROMA_PATH:-/app/data/chroma_db}
  UPLOAD_PATH: ${UPLOAD_PATH:-/app/data/uploads}
  OUTPUT_PATH: ${OUTPUT_PATH:-/app/data/outputs}
  KNOWLEDGE_BASE_PATH: ${KNOWLEDGE_BASE_PATH:-/app/data/knowledge_base}
  TEMPLATE_PATH: ${TEMPLATE_PATH:-/app/data/templates}
  APP_VERSION: ${APP_VERSION:-1.0.0}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-frontend-build-args: &frontend-build-args
  NEXT_PUBLIC_API_BASE_URL: /api/v1
  NEXT_PUBLIC_ARIA_UI_PROFILE: ${ARIA_UI_PROFILE:-experience}

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aria-postgres
    environment:
      POSTGRES_DB: aria_db
      POSTGRES_USER: aria_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aria_admin -d aria_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    container_name: aria-backend
    environment:
      <<: *backend-environment
      DATABASE_URL: postgresql://aria_admin:${POSTGRES_PASSWORD:-localdev123}@postgres:5432/aria_db
      SAMPLES_RFQ_PATH: /app/samples/rfq
      # Docker: reach host Ollama; override localhost from .env.local
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      VALIDATION_CORPUS_PATH: /app/data/validation_corpus
    volumes:
      - ./backend/data:/app/data
      - ./samples:/app/samples:ro
      - ${VALIDATION_CORPUS_HOST:-E:/AI文档项目/RE_ 报价AI需求沟通}:/app/data/validation_corpus:ro
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        <<: *frontend-build-args
    container_name: aria-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"

  nginx:
    image: nginx:alpine
    container_name: aria-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
