# Docker Compose — 国内镜像源版本
# 用法: docker compose -f docker-compose.cn.yml up --build
#
# 若仍失败，先运行: .\scripts\pull-images-cn.ps1

services:
  postgres:
    image: docker.m.daocloud.io/library/postgres:16-alpine
    container_name: aria-postgres
    environment:
      POSTGRES_DB: aria_db
      POSTGRES_USER: aria_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aria_admin -d aria_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.cn
    container_name: aria-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://aria_admin:${POSTGRES_PASSWORD:-localdev123}@postgres:5432/aria_db
    volumes:
      - ./backend/data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.cn
      args:
        NEXT_PUBLIC_API_BASE_URL: /api/v1
    container_name: aria-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"

  nginx:
    image: docker.m.daocloud.io/library/nginx:alpine
    container_name: aria-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
