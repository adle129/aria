# Phase 0 fast start: skip heavy backend AI packages for quicker builds
# Usage: scripts/up.sh --dev-fast
x-backend-environment: &backend-environment
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:14b}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
  MOCK_LLM: ${MOCK_LLM:-true}
  MOCK_RAG: ${MOCK_RAG:-true}
  ARIA_UI_PROFILE: ${ARIA_UI_PROFILE:-experience}
  KB_DEBUG_ENABLED: ${KB_DEBUG_ENABLED:-false}
  PROMPT_VERSION: ${PROMPT_VERSION:-v1}
  CHROMA_PATH: ${CHROMA_PATH:-/app/data/chroma_db}
  UPLOAD_PATH: ${UPLOAD_PATH:-/app/data/uploads}
  OUTPUT_PATH: ${OUTPUT_PATH:-/app/data/outputs}
  KNOWLEDGE_BASE_PATH: ${KNOWLEDGE_BASE_PATH:-/app/data/knowledge_base}
  TEMPLATE_PATH: ${TEMPLATE_PATH:-/app/data/templates}
  APP_VERSION: ${APP_VERSION:-1.0.0}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-frontend-build-args: &frontend-build-args
  NEXT_PUBLIC_API_BASE_URL: /api/v1
  NEXT_PUBLIC_ARIA_UI_PROFILE: ${ARIA_UI_PROFILE:-experience}

services:
  postgres:
    image: postgres:16-alpine
    container_name: aria-postgres
    environment:
      POSTGRES_DB: aria_db
      POSTGRES_USER: aria_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aria_admin -d aria_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      args:
        INSTALL_AI: "false"
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    container_name: aria-backend
    environment:
      <<: *backend-environment
      DATABASE_URL: postgresql://aria_admin:${POSTGRES_PASSWORD:-localdev123}@postgres:5432/aria_db
    volumes:
      - ./backend/data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        <<: *frontend-build-args
    container_name: aria-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"

  nginx:
    image: nginx:alpine
    container_name: aria-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
